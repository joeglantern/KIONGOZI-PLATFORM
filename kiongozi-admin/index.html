<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/KchatLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiongozi Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet" />
    <!-- Apply persisted theme before React renders to prevent flash -->
    <script>try{const t=JSON.parse(localStorage.getItem('kiongozi-admin-ui')||'{}').state?.theme;document.documentElement.className=t==='light'?'light':'dark';}catch(e){document.documentElement.className='dark';}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
