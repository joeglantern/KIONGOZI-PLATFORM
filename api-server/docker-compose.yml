services:
  api:
    build: .
    image: kiongozi-api:latest
    container_name: kiongozi-api
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    # Published on localhost only — the host nginx (which serves multiple sites
    # on this VPS) proxies api.kiongozi.org → 127.0.0.1:3001. Do NOT run a
    # second nginx in Docker here; ports 80/443 belong to the host nginx.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
