<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiongozi AI drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E5E5EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0B; color: #FFFFFF; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
  <aside aria-label="Kiongozi AI menu" style="position: absolute; left: 0; top: 0; bottom: 0; width: 328px; padding: 56px 0 30px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 18px; height: 52px">
      <img src="/_blob/71ef4fe5fc13b928215daec693b4b115" alt="" style="width: 30px; height: 30px; border-radius: 15px; object-fit: cover">
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px">Kiongozi AI</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 6px 14px 0">
      <button style="height: 46px; border-radius: 23px; border: 0; background: #FFFFFF; color: #000000; font-size: 16px; font-weight: 700; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New chat
      </button>
      <button style="height: 44px; border-radius: 14px; border: 0; background: #141414; color: #6E6E73; font-size: 15.5px; font-family: inherit; display: flex; align-items: center; gap: 8px; padding: 0 14px">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search chats
      </button>
    </div>

    <p style="margin: 24px 18px 8px; font-size: 13px; font-weight: 600; color: #6E6E73">Recents</p>
    <div style="margin: 0 14px; border-radius: 16px; background: #141414; overflow: hidden">
      <sc-for list="{{recents}}" as="r" hint-placeholder-count="5">
        <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 48px; text-decoration: none; color: #FFFFFF; background: {{r.bg}}; border-top: {{r.line}}">
          <span style="flex: 1; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
          <span style="font-size: 12.5px; color: #6E6E73">{{r.when}}</span>
        </a>
      </sc-for>
    </div>
    <a href="#" style="display: flex; align-items: center; gap: 6px; margin: 10px 18px 0; height: 40px; text-decoration: none; color: #FFFFFF">
      <span style="flex: 1; font-size: 15px; font-weight: 600">See all chats</span>
      <span style="font-size: 14px; color: #6E6E73">23</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="margin: auto 14px 0; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: #141414">
      <div style="width: 36px; height: 36px; border-radius: 18px; background: #5B2A6E; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">JK</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 600">Joe Kamau</span>
        <span style="font-size: 13px; color: #6E6E73">@joeglantern</span>
      </div>
    </div>
  </aside>

  <div aria-hidden="true" style="position: absolute; left: 328px; top: 0; bottom: 0; width: 390px; background: #000000; border-radius: 24px 0 0 24px; opacity: 0.55"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (title, when, i, active) => ({ title, when, bg: active ? '#1E1E1E' : 'transparent', line: i ? '1px solid #262626' : '0' });
    return {
      recents: [
        mk('Green jobs I can start this year', 'Today', 0, true),
        mk('County budget explained', 'Today', 1),
        mk('Free courses for digital skills', 'Yesterday', 2),
        mk('Plan a tree planting day', 'Yesterday', 3),
        mk('How to register to vote', 'Monday', 4),
      ],
    };
  }
}
</script>
</body>
</html>
