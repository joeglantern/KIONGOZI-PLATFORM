<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baraza room, redesigned</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007AFF}a:hover{color:#0062cc}
@keyframes bz-glow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.18)}}
@keyframes bz-sway{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(-20deg)}}
@keyframes bz-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bz-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes bz-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.bz-glow{animation:bz-glow 1.7s ease-in-out infinite}
.bz-stick{animation:bz-sway 2.6s ease-in-out infinite;transform-origin:50% 92%}
.bz-bob{animation:bz-bob 2.6s ease-in-out infinite}
.bz-breathe{animation:bz-breathe 2.2s ease-in-out infinite}
.bz-wave{animation:bz-wave 1.1s ease-in-out infinite;transform-origin:50% 90%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF 0%, #FBF7F1 60%, #F6EEDC 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #16130F; position: relative; overflow: hidden">
  <!-- header -->
  <div style="position: absolute; left: 0; right: 0; top: 54px; display: flex; align-items: center; gap: 8px; padding: 0 16px">
    <button aria-label="Leave" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(22,19,15,.06); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.4px">[Baraza title]</div>
      <div style="display: flex; gap: 6px; margin-top: 5px">
        <span style="display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 5px; border-radius: 12px; background: rgba(22,19,15,.06)"><img src="/_blob/89031e2c90b0ade68cd8fad0ea9eeaad" alt="" style="width: 17px"><span style="font-size: 12px; font-weight: 700; color: #C9472F">Live</span></span>
        <a href="Who.dc.html" style="display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 5px; border-radius: 12px; background: rgba(22,19,15,.06); text-decoration: none"><img src="/_blob/781db85d7c4d3ace7236c47a2948dc11" alt="" style="width: 17px"><span style="font-size: 12px; font-weight: 700; color: #16130F">7</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8F877D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
        <span style="display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 5px; border-radius: 12px; background: rgba(22,19,15,.06)"><img src="/_blob/9e22937fbf8382417ad37cd8555ff2b2" alt="" style="width: 17px"><span style="font-size: 12px; font-weight: 700; color: #5E574F">Minutes</span></span>
      </div>
    </div>
    <button aria-label="Room style" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(22,19,15,.06); display: flex; align-items: center; justify-content: center">

    </button>
  </div>

  <!-- the stage: warm light pool, raised dais, bead hoop timer, speaker, stick -->
  <div style="position: absolute; left: 0; right: 0; top: 150px; height: 300px">
    <div style="position: absolute; left: 50%; top: 150px; width: 340px; height: 150px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(242,168,29,.30), rgba(242,168,29,0))"></div>
    <!-- the carved dais -->
    <img src="/_blob/dc9e5642b80737b28b708f1a3493b302" alt="" style="position: absolute; left: 50%; top: 150px; width: 300px; transform: translateX(-50%)">
    <!-- bead hoop as the turn timer: the used part fades -->
    <img class="bz-breathe" src="/_blob/89b1c75cec41b60e1576a9bfbb8e04a7" alt="" style="position: absolute; left: 50%; top: 20px; width: 204px; transform: translateX(-50%)">
    <div style="position: absolute; left: 50%; top: 20px; width: 204px; height: 204px; transform: translateX(-50%); border-radius: 50%; background: rgba(251,247,241,.72); clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 50% 100%)"></div>
    <div style="position: absolute; left: 50%; top: 48px; width: 148px; height: 148px; transform: translateX(-50%); border-radius: 50%; background: linear-gradient(135deg, #3FA845, #86BD2E); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 56px; font-weight: 800; box-shadow: 0 10px 24px rgba(0,0,0,.18), 0 0 0 5px #fff">J</div>
    <div class="bz-glow" style="position: absolute; left: 258px; top: 40px; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,214,120,.95), rgba(255,190,90,0))"></div>
    <img class="bz-stick" src="/_blob/b47e660922f4cb91a8dfd2fd26b6c540" alt="The talking stick" style="position: absolute; left: 266px; top: 52px; width: 64px">
    <!-- speech card that breathes -->
    <div style="position: absolute; left: 24px; right: 24px; top: 262px; background: #fff; border-radius: 20px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(107,74,31,.14); display: flex; gap: 10px; align-items: flex-start">
      <div style="width: 26px; height: 26px; border-radius: 13px; background: #F6EEDC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E9A23B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M9 6v12M14 9v6M19 4v16"></path></svg></div>
      <div><div style="font-size: 13px; font-weight: 700; color: #3FA845">@[speaker] · 1:24 left</div><div style="font-size: 16px; line-height: 22px; margin-top: 2px">[Live captions of what the speaker is saying right now]</div></div>
    </div>
  </div>

  <!-- the circle: stools with people -->
  <div style="position: absolute; left: 0; right: 0; top: 486px; height: 170px">
    <div class="bz-bob" style="position: absolute; left: 22px; top: 40px; display: flex; flex-direction: column; align-items: center; width: 64px">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FF6A3D; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); position: relative; z-index: 1">K</div>
      <img src="/_blob/43c2a056076b9956090eebd25acad981" alt="" style="width: 46px; margin-top: -16px">
      <div style="margin-top: 2px; display: flex; align-items: center; gap: 2px; font-size: 11px; color: #5E574F"><img src="/_blob/b553c303a7bc2d6abd45f2a341dc947b" alt="" style="width: 10px">Mombasa</div>
    </div>
    <div class="bz-bob" style="position: absolute; left: 104px; top: 8px; display: flex; flex-direction: column; align-items: center; width: 64px; animation-delay: .4s">
      <div style="position: relative; z-index: 1">
        <div style="width: 44px; height: 44px; border-radius: 22px; background: #F2A81D; color: #1E1236; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2.5px solid #E9A23B; box-shadow: 0 4px 10px rgba(0,0,0,.15)">M</div>
        <div class="bz-wave" style="position: absolute; right: -10px; top: -12px; width: 26px; height: 26px; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.18)"><img src="/_blob/1a3f081e23043c0d6b50f6dc11e690e9" alt="" style="width: 16px"></div>
        <div style="position: absolute; left: -6px; top: -6px; width: 20px; height: 20px; border-radius: 10px; background: #E9A23B; color: #1C1408; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff">1</div>
      </div>
      <img src="/_blob/43c2a056076b9956090eebd25acad981" alt="" style="width: 46px; margin-top: -16px">
      <div style="margin-top: 2px; font-size: 11px; color: #5E574F">next up</div>
    </div>
    <div class="bz-bob" style="position: absolute; left: 186px; top: 0; display: flex; flex-direction: column; align-items: center; width: 64px; animation-delay: .8s">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #5B4BC4; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); position: relative; z-index: 1">A</div>
      <img src="/_blob/43c2a056076b9956090eebd25acad981" alt="" style="width: 46px; margin-top: -16px">
      <div style="margin-top: 2px; display: flex; align-items: center; gap: 2px; font-size: 11px; color: #5E574F"><img src="/_blob/b553c303a7bc2d6abd45f2a341dc947b" alt="" style="width: 10px">Kisumu</div>
    </div>
    <div class="bz-bob" style="position: absolute; left: 268px; top: 8px; display: flex; flex-direction: column; align-items: center; width: 64px; animation-delay: 1.2s">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #1F7A8C; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); position: relative; z-index: 1">W</div>
      <img src="/_blob/43c2a056076b9956090eebd25acad981" alt="" style="width: 46px; margin-top: -16px">
      <div style="margin-top: 2px; font-size: 11px; color: #5E574F">host</div>
    </div>
    <div style="position: absolute; left: 330px; top: 48px; width: 44px; height: 44px; border-radius: 22px; background: rgba(22,19,15,.08); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #5E574F">+3</div>
  </div>

  <!-- controls: one dock -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; border-radius: 32px; background: #fff; box-shadow: 0 12px 34px rgba(107,74,31,.18); display: flex; align-items: center; padding: 0 8px 0 8px; gap: 8px">
    <button aria-label="React" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #F6EEDC; font-size: 20px">&#128293;</button>
    <button style="flex-grow: 1; height: 48px; border-radius: 24px; border: 0; background: #E9A23B; color: #1C1408; font-family: inherit; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 35%; background: rgba(255,255,255,.35)"></span>
      <span style="position: relative; display: flex; align-items: center; gap: 8px"><img src="/_blob/1a3f081e23043c0d6b50f6dc11e690e9" alt="" style="width: 22px">Hand up · 2nd in line</span>
    </button>
    <button aria-label="Mute" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #F6EEDC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></button>
  </div>
</div>
</x-dc>
