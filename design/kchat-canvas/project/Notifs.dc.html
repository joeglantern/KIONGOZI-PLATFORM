<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007AFF}a:hover{color:#0062cc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; overflow: hidden">
  <div style="padding: 58px 16px 10px; display: flex; align-items: flex-end">
    <h1 style="margin: 0; flex-grow: 1; font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.37px">Activity</h1>
    <a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none; margin-bottom: 8px">Mark all read</a>
  </div>

  <!-- pinned follow requests -->
  <div style="margin: 0 16px 6px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #F2F2F7">
    <div style="display: flex"><div style="width: 40px; height: 40px; border-radius: 20px; background: #FF6A3D; border: 2.5px solid #F2F2F7"></div><div style="width: 40px; height: 40px; border-radius: 20px; background: #F2A81D; border: 2.5px solid #F2F2F7; margin-left: -14px"></div><div style="width: 40px; height: 40px; border-radius: 20px; background: #5B4BC4; border: 2.5px solid #F2F2F7; margin-left: -14px"></div></div>
    <div style="flex-grow: 1"><div style="font-size: 15.5px; font-weight: 700">Follow requests</div><div style="font-size: 13.5px; color: #6B6B70">@[name] and 4 others</div></div>
    <span style="width: 10px; height: 10px; border-radius: 5px; background: #3FA845"></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </div>

  <div style="padding: 14px 16px 4px; font-size: 13px; font-weight: 600; color: #8A8A8E; letter-spacing: -0.08px">NEW</div>
  <!-- grouped like -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #F7FBF7">
    <div style="position: relative; width: 48px; height: 48px"><div style="position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 17px; background: #FF6A3D"></div><div style="position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-radius: 17px; background: #F2A81D; border: 2.5px solid #F7FBF7"></div></div>
    <div style="flex-grow: 1; font-size: 15px; line-height: 20px"><b>@[name]</b> and <a href="#" style="font-weight: 700; text-decoration: none; color: #000">12 others</a> liked your post <span style="color: #8A8A8E">· 2m</span></div>
    <div style="width: 44px; height: 44px; border-radius: 8px; background: #DCE8DC"></div>
  </div>
  <!-- follow with instant follow back -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #F7FBF7">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #5B4BC4"></div>
    <div style="flex-grow: 1; font-size: 15px; line-height: 20px"><b>@[name]</b> started following you <span style="color: #8A8A8E">· 15m</span></div>
    <button style="height: 32px; border-radius: 16px; border: 0; background: #000; color: #fff; font-weight: 700; font-size: 14px; padding: 0 14px">Follow back</button>
  </div>
  <!-- reply with inline like -->
  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #1F7A8C"></div>
    <div style="flex-grow: 1">
      <div style="font-size: 15px; line-height: 20px"><b>@[name]</b> replied <span style="color: #8A8A8E">· 1h</span></div>
      <div style="font-size: 15px; line-height: 20px; color: #3C3C43; margin-top: 2px">[Their reply, first two lines…]</div>
      <div style="display: flex; gap: 16px; margin-top: 6px; font-size: 13px; color: #8A8A8E"><span>Like</span><span>Reply</span></div>
    </div>
  </div>

  <div style="padding: 14px 16px 4px; font-size: 13px; font-weight: 600; color: #8A8A8E">THIS WEEK</div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #F2A81D"></div>
    <div style="flex-grow: 1; font-size: 15px; line-height: 20px"><b>@[name]</b> mentioned you in a baraza <span style="color: #8A8A8E">· Tue</span></div>
    <div style="width: 44px; height: 44px; border-radius: 8px; background: linear-gradient(135deg,#C9C6F2,#FFD9A8)"></div>
  </div>
  <!-- a row mid-swipe to dismiss -->
  <div style="position: relative; height: 68px; overflow: hidden">
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 84px; background: #FF3B30; color: #fff; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Remove</div>
    <div style="position: absolute; left: -84px; width: 390px; top: 0; bottom: 0; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #3FA845"></div>
      <div style="flex-grow: 1; font-size: 15px; line-height: 20px"><b>@[name]</b> reposted your post <span style="color: #8A8A8E">· Mon</span></div>
      <div style="width: 44px; height: 44px; border-radius: 8px; background: #DCE8DC"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
