<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CB85C}a:hover{color:#7DCF7D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 58px 16px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.8px">Explore</h1>
      <button aria-label="Find friends" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M19 8v6M16 11h6"></path></svg>
      </button>
    </div>
    <label style="height: 44px; border-radius: 22px; background: #1A1A1A; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search</span>
      <input placeholder="Search people, posts, #tags" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-size: 15px; font-family: Inter, system-ui, sans-serif">
    </label>
  </header>

  <section style="padding: 10px 16px 0">
    <h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Trending in Kenya</h2>
    <sc-for list="{{trends}}" as="t" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 9px 0; text-decoration: none; color: #FFFFFF">
        <span style="width: 18px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: #7C7C80">{{t.rank}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">{{t.tag}}</span>
          <span style="font-size: 13px; color: #8E8E93">{{t.meta}}</span>
        </span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C7C80" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </section>

  <section style="padding: 14px 16px 0">
    <h2 style="margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Watch &amp; see</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 112px 112px; gap: 3px; border-radius: 16px; overflow: hidden">
      <div style="grid-row: span 2; position: relative">
        <img src="/_blob/1f726465718b3d239ff7b5fda66be273" alt="Video post" style="width: 100%; height: 100%; object-fit: cover">
        <span style="position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"></path></svg>5.4K
        </span>
      </div>
      <img src="/_blob/4d703504f902ee4fea355c8815542b5a" alt="Photo post" style="width: 100%; height: 100%; object-fit: cover">
      <div style="background: #14653F; padding: 10px; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; line-height: 16px">Sauti ya vijana ni muhimu.</div>
      <img src="/_blob/4d703504f902ee4fea355c8815542b5a" alt="Photo post" style="width: 100%; height: 100%; object-fit: cover; object-position: top">
      <img src="/_blob/1f726465718b3d239ff7b5fda66be273" alt="Photo post" style="width: 100%; height: 100%; object-fit: cover; object-position: bottom">
    </div>
  </section>

  <section style="padding: 18px 0 0">
    <h2 style="margin: 0 16px 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">People to follow</h2>
    <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
        <div style="width: 132px; flex-shrink: 0; border-radius: 18px; background: #111111; border: 1px solid #1C1C1E; padding: 14px 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 60px; height: 60px; border-radius: 30px; background: {{p.fill}}; display: flex; align-items: center; justify-content: center; font-weight: 700">{{p.initials}}</div>
          <span style="font-size: 14px; font-weight: 700; max-width: 110px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{p.name}}</span>
          <span style="font-size: 12px; color: #8E8E93">@{{p.handle}}</span>
          <button style="margin-top: 4px; width: 100%; height: 34px; border-radius: 17px; border: 0; background: #FFFFFF; color: #000000; font-size: 14px; font-weight: 700">Follow</button>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      trends: [
        { rank: '1', tag: '#U2i', meta: '1,204 posts · Civic' },
        { rank: '2', tag: '#SautiYetu', meta: '612 posts' },
        { rank: '3', tag: '#Nairobi', meta: '388 posts' },
      ],
      people: [
        { name: 'Mercy Njeri', handle: 'njeri_from_ke', initials: 'MN', fill: '#8A3B12' },
        { name: 'Brian Otieno', handle: 'brian.otieno', initials: 'BO', fill: '#1D3A6E' },
        { name: 'Faith Wambui', handle: 'faith_wambui', initials: 'FW', fill: '#5B2A6E' },
      ],
    };
  }
}
</script>
</body>
</html>
