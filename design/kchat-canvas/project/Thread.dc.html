<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CB85C}a:hover{color:#7DCF7D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 4px 0; height: 50px; display: flex; align-items: center">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="flex: 1; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Thread</span>
    <span style="width: 44px"></span>
  </header>

  <article style="display: flex; gap: 12px; padding: 12px 16px 0">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #0F5132; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AF</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px"><strong>AFOSI</strong> <span style="color: #7C7C80">@afosi</span></span>
      <p style="margin: 0; font-size: 15px; line-height: 21px">Youth in Nairobi on what civic voice means to them. Watch V1 of the U2i series. #U2i #SautiYetu</p>
      <img src="/_blob/1f726465718b3d239ff7b5fda66be273" alt="Video post" style="width: 100%; height: 170px; object-fit: cover; border-radius: 14px">
    </div>
  </article>
  <p style="margin: 10px 16px 0; font-size: 14px; color: #7C7C80">2:41 PM · Oct 27 · 5.4K views</p>
  <div style="height: 1px; background: #1C1C1E; margin: 12px 0 0"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px">
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">Replies</span>
    <span style="font-size: 14px; color: #7C7C80">48</span>
  </div>

  <sc-for list="{{replies}}" as="r" hint-placeholder-count="3">
    <article style="display: flex; gap: 12px; padding: 10px 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="width: 36px; height: 36px; border-radius: 18px; background: {{r.fill}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{r.initials}}</div>
        <span style="flex: 1; width: 2px; background: {{r.line}}; border-radius: 1px"></span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px"><strong>{{r.handle}}</strong> <span style="color: #7C7C80">· {{r.time}}</span></span>
        <p style="margin: 0; font-size: 15px; line-height: 21px">{{r.text}}</p>
      </div>
    </article>
  </sc-for>

  <span style="flex: 1"></span>
  <footer style="padding: 8px 10px 30px; display: flex; align-items: center; gap: 8px">
    <div style="width: 32px; height: 32px; border-radius: 16px; background: #5B2A6E; flex-shrink: 0"></div>
    <label style="flex: 1; min-height: 44px; border-radius: 22px; background: #1A1A1A; display: flex; align-items: center; padding: 0 6px 0 16px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Reply</span>
      <input placeholder="Reply to @afosi…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-size: 15px; font-family: Inter, system-ui, sans-serif">
      <button aria-label="Send reply" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #5CB85C; opacity: 0.4; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      replies: [
        { handle: 'njeri_from_ke', initials: 'MN', fill: '#8A3B12', time: '1h', text: 'Hii ni kweli kabisa. Vijana tukiungana tunaweza kubadilisha mambo.', line: '#2C2C2E' },
        { handle: 'afosi', initials: 'AF', fill: '#0F5132', time: '58m', text: 'Asante Mercy! Share with your group 🙌', line: 'transparent' },
        { handle: 'brian.otieno', initials: 'BO', fill: '#1D3A6E', time: '40m', text: 'The part about county budgets hit hard.', line: 'transparent' },
      ],
    };
  }
}
</script>
</body>
</html>
