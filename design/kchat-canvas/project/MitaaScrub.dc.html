<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mitaa scrubbing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #fff; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #3A2E5C 0%, #0B0B10 70%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0))"></div>
  <div style="position: absolute; top: 56px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700">Mitaa</div>

  <!-- rail and caption, faded while scrubbing -->
  <div style="position: absolute; right: 10px; bottom: 150px; display: flex; flex-direction: column; align-items: center; gap: 18px; opacity: .25">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #F2A81D; border: 2px solid #fff"></div>
    <div style="font-size: 12.5px; font-weight: 600">1.2K</div><div style="font-size: 12.5px; font-weight: 600">84</div><div style="font-size: 12.5px; font-weight: 600">Share</div>
  </div>
  <div style="position: absolute; left: 14px; right: 90px; bottom: 100px; opacity: .25"><div style="font-size: 16px; font-weight: 700">@[username]</div><div style="font-size: 14.5px; line-height: 20px; color: rgba(255,255,255,.9)">[Caption text]</div></div>

  <!-- big time bubble -->
  <div style="position: absolute; left: 0; right: 0; bottom: 120px; text-align: center">
    <span style="font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.5)">0:12</span><span style="font-size: 20px; font-weight: 700; color: rgba(255,255,255,.65); font-variant-numeric: tabular-nums"> / 0:45</span>
  </div>

  <!-- the grabbed bar -->
  <div style="position: absolute; left: 14px; right: 14px; bottom: 50px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3)">
    <div style="width: 27%; height: 100%; border-radius: 4px; background: #F2B544"></div>
    <div style="position: absolute; left: calc(27% - 8px); top: -4px; width: 16px; height: 16px; border-radius: 8px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4)"></div>
    <!-- a finger -->
    <div style="position: absolute; left: calc(27% - 22px); top: -40px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.5)"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 12px; color: rgba(255,255,255,.55)">drag anywhere along the bottom · tap the bar to jump · the picture follows your finger</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
