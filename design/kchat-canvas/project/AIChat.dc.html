<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiongozi AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5CB85C}a:hover{color:#7DCF7D}
@keyframes drift{0%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(8deg)}100%{transform:scale(1) rotate(0deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 50px 4px 0; height: 48px; display: flex; align-items: center">
    <button aria-label="Chat history" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16"></path></svg>
    </button>
    <span style="flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.3px">Kiongozi AI</span>
    <button aria-label="New chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #1E1E1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px 40px">
    <div style="width: 64px; height: 64px; border-radius: 32px; overflow: hidden">
      <img src="/_blob/71ef4fe5fc13b928215daec693b4b115" alt="" style="width: 100%; height: 100%; object-fit: cover; animation: drift 6s ease-in-out infinite">
    </div>
    <p style="margin: 20px 0 0; font-size: 17px; font-weight: 500; color: #A1A1A6">Good evening, Joe</p>
    <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.6px; text-align: center">What can I help with?</h1>
  </main>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 12px 10px">
    <sc-for list="{{pills}}" as="p" hint-placeholder-count="4">
      <button style="min-height: 60px; padding: 8px 10px; border-radius: 18px; border: 1px solid #262626; background: #141414; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 10px; text-align: left">
        <img src="{{p.art}}" alt="" style="width: 40px; height: 40px; flex-shrink: 0">
        <span style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.label}}</span>
          <span style="font-size: 12.5px; color: #6E6E73">{{p.hint}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <footer style="padding: 4px 12px 30px">
    <label style="min-height: 52px; border-radius: 26px; border: 1px solid #262626; background: #141414; display: flex; align-items: center; padding: 6px 6px 6px 16px; box-sizing: border-box">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</span>
      <input placeholder="Ask anything" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-size: 16px; font-family: inherit">
      <button aria-label="Send" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #1E1E1E; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </label>
    <p style="margin: 8px 0 0; text-align: center; font-size: 11.5px; color: #6E6E73">Kiongozi AI can make mistakes. Check important info.</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { pills: [
      { label: 'Green careers', hint: 'Jobs that grow', art: '/_blob/3390b10c2137874fb4205099be6d87ae' },
      { label: 'Know my rights', hint: 'Simply explained', art: '/_blob/de060f690093cdc227d53ae97844169e' },
      { label: 'Digital skills', hint: 'Where to start', art: '/_blob/9f0707c9e8eba353a3e6ba595f154ccd' },
      { label: 'Community project', hint: 'Plan it together', art: '/_blob/814fc44458eb6c33d3d0812b5477c328' },
    ] };
  }
}
</script>
</body>
</html>
