body{margin:0}

@keyframes bz-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bz-island{animation:bz-float 4.2s ease-in-out infinite}
.bz-cloud1{animation:bz-drift 9s ease-in-out infinite alternate}
.bz-cloud2{animation:bz-drift2 11s ease-in-out infinite alternate}
.bz-glow{animation:bz-glow 2.4s ease-in-out infinite}
.bz-stick{animation:bz-sway 3.2s ease-in-out infinite;transform-origin:50% 95%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; display: flex; flex-direction: column; overflow: hidden">

    </div>
  </div>
