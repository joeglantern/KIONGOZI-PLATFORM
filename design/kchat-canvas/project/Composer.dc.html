<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text story composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E5E5EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{bg}}; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
  <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0; opacity: 0.09">
    <defs>
      <pattern id="kitenge" width="64" height="64" patternUnits="userSpaceOnUse">
        <path d="M32 4 60 32 32 60 4 32z" fill="none" stroke="#FFFFFF" stroke-width="2"></path>
        <circle cx="32" cy="32" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"></circle>
        <circle cx="32" cy="32" r="3" fill="#FFFFFF"></circle>
        <circle cx="0" cy="0" r="5" fill="#FFFFFF"></circle><circle cx="64" cy="0" r="5" fill="#FFFFFF"></circle>
        <circle cx="0" cy="64" r="5" fill="#FFFFFF"></circle><circle cx="64" cy="64" r="5" fill="#FFFFFF"></circle>
      </pattern>
    </defs>
    <rect width="390" height="844" fill="url(#kitenge)"></rect>
  </svg>

  <header style="position: absolute; left: 8px; right: 8px; top: 52px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
    <div style="display: flex; gap: 6px">
      <button aria-label="Change font" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.25); color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px">Aa</button>
      <button aria-label="Text background style" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="M8 12h8"></path></svg>
      </button>
      <button aria-label="Change background" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"></path></svg>
      </button>
      <button aria-label="Add sticker" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.25); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h7l7-7V7a4 4 0 0 0-4-4z"></path><path d="M14 21v-3a4 4 0 0 1 4-4h3"></path></svg>
      </button>
    </div>
  </header>

  <div style="position: absolute; left: 28px; right: 28px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 22px">
    <p style="margin: 0; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; line-height: 42px; letter-spacing: -0.5px; color: {{textColor}}">Kesho ni siku ya kujiandikisha. Twende pamoja!</p>
    <span style="transform: rotate(-5deg); padding: 10px 16px; border-radius: 14px; background: #F5B83D; color: #1B1B1B; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; border: 3px solid #FFFFFF">NIMEJIANDIKISHA ✓</span>
  </div>

  <div aria-label="Text colour" role="radiogroup" style="position: absolute; left: 0; right: 0; bottom: 120px; display: flex; justify-content: center; gap: 10px">
    <sc-for list="{{colors}}" as="c" hint-placeholder-count="7">
      <button role="radio" aria-checked="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 30px; height: 30px; border-radius: 15px; background: {{c.hex}}; border: {{c.border}}; box-sizing: border-box"></button>
    </sc-for>
  </div>

  <footer style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; align-items: center; gap: 10px">
    <button style="height: 48px; padding: 0 16px; border-radius: 24px; border: 0; background: rgba(0,0,0,0.3); color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path></svg>
      Kila mtu · 24h
    </button>
    <span style="flex: 1"></span>
    <button style="height: 48px; padding: 0 22px; border-radius: 24px; border: 0; background: #FFFFFF; color: #000000; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
      Shiriki
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0F5132","options":["#0F5132","#8A1C1C","#1D3A6E","#B4531A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = this.state.color ?? '#FFFFFF';
    const list = [
      ['#FFFFFF', 'White'], ['#000000', 'Black'], ['#F5B83D', 'Amber'], ['#FF5A5F', 'Coral'],
      ['#5CB85C', 'Green'], ['#7FD3F7', 'Sky'], ['#C792EA', 'Lilac'],
    ];
    return {
      bg: this.props.bg ?? '#0F5132',
      textColor: picked,
      colors: list.map(([hex, label]) => ({
        hex, label,
        on: hex === picked ? 'true' : 'false',
        border: hex === picked ? '3px solid #FFFFFF' : '2px solid rgba(255,255,255,0.5)',
        pick: () => this.setState({ color: hex }),
      })),
    };
  }
}
</script>
</body>
</html>
