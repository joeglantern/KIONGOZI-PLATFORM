<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5CB85C}a:hover{color:#7DCF7D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 54px 4px 4px; display: flex; align-items: center">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0 0 0 4px; flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.7px">Messages</h1>
    <button aria-label="New message" style="width: 44px; height: 44px; margin-right: 12px; border-radius: 22px; border: 0; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </button>
  </header>
  <div style="padding: 6px 16px 4px">
    <label style="height: 42px; border-radius: 21px; background: #1A1A1A; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search messages</span>
      <input placeholder="Search" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-size: 15px; font-family: Inter, system-ui, sans-serif">
    </label>
  </div>
  <nav aria-label="Filter" style="display: flex; gap: 8px; padding: 8px 16px 6px">
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #FFFFFF; background: #FFFFFF; color: #000000; font-size: 14px; font-weight: 600">All</button>
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2C2C2E; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 600">Unread 2</button>
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2C2C2E; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 600">Archived</button>
  </nav>
  <ul style="list-style: none; margin: 4px 0 0; padding: 0">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
        <div style="width: 54px; height: 54px; border-radius: 27px; background: {{c.fill}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700">{{c.initials}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 16px; font-weight: {{c.nameWeight}}">{{c.name}}</span>
          <span style="font-size: 14px; color: {{c.previewColor}}; font-weight: {{c.previewWeight}}; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{c.preview}} <span style="color: #7C7C80; font-weight: 400">· {{c.time}}</span></span>
        </div>
        <sc-if value="{{c.unread}}" hint-placeholder-val="{{true}}"><span aria-label="Unread" style="width: 10px; height: 10px; border-radius: 5px; background: #5CB85C"></span></sc-if>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, initials, fill, preview, time, unread) => ({
      name, initials, fill, preview, time, unread,
      nameWeight: unread ? '700' : '500',
      previewColor: unread ? '#FFFFFF' : '#8E8E93',
      previewWeight: unread ? '600' : '400',
    });
    return {
      chats: [
        mk('Mercy Njeri', 'MN', '#8A3B12', 'Tuonane kesho kwa meeting?', '2m', true),
        mk('Brian Otieno', 'BO', '#1D3A6E', 'Sent a photo', '18m', true),
        mk('Faith Wambui', 'FW', '#5B2A6E', 'You: Asante sana!', '1h', false),
        mk('AFOSI', 'AF', '#0F5132', 'Thanks for joining the U2i session', '3h', false),
        mk('Kevin Mutua', 'KM', '#2F5D3A', 'Reacted 🔥 to your story', 'Yesterday', false),
        mk('Amina Hassan', 'AH', '#6E4A1D', 'You: poa, nitakutumia link', 'Mon', false),
      ],
    };
  }
}
</script>
</body>
</html>
