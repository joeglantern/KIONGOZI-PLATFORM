<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E5E5EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/1f726465718b3d239ff7b5fda66be273" alt="Story photo: young woman walking on a Nairobi street" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0 0 20px 20px">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 160px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0))"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.7))"></div>

  <div style="position: absolute; left: 8px; right: 8px; top: 52px; display: flex; gap: 3px" role="progressbar" aria-label="Story 2 of 4" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2">
    <span style="flex: 1; height: 2.5px; border-radius: 2px; background: #FFFFFF"></span>
    <span style="flex: 1; height: 2.5px; border-radius: 2px; background: linear-gradient(90deg, #FFFFFF 58%, rgba(255,255,255,0.35) 58%)"></span>
    <span style="flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
    <span style="flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span>
  </div>

  <header style="position: absolute; left: 12px; right: 4px; top: 64px; display: flex; align-items: center; gap: 10px">
    <div style="width: 34px; height: 34px; border-radius: 17px; background: #0F5132; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; border: 1.5px solid rgba(255,255,255,0.8); box-sizing: border-box">AF</div>
    <div style="display: flex; align-items: center; gap: 6px; flex: 1; font-size: 14px">
      <strong style="font-weight: 600">afosi</strong>
      <svg role="img" aria-label="Verified" width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#5CB85C"></circle><path d="M4.5 8.2 7 10.5l4.5-5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="color: rgba(255,255,255,0.75)">saa 3</span>
    </div>
    <button aria-label="Mute" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"></path></svg>
    </button>
    <button aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
    <button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </header>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
    <span style="align-self: center; transform: rotate(-4deg); padding: 8px 14px; border-radius: 10px; background: #FFFFFF; color: #000000; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">Sauti yetu ina nguvu 💪</span>
    <span style="align-self: center; padding: 6px 12px; border-radius: 16px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.35); font-size: 13px; font-weight: 600">🔗 u2i.afosi.org</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center; gap: 8px">
    <sc-for list="{{reactions}}" as="r" hint-placeholder-count="6">
      <button aria-label="{{r.label}}" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(255,255,255,0.14); font-size: 24px; display: flex; align-items: center; justify-content: center">{{r.emoji}}</button>
    </sc-for>
  </div>

  <footer style="position: absolute; left: 12px; right: 8px; bottom: 30px; display: flex; align-items: center; gap: 6px">
    <label style="flex: 1; height: 46px; border-radius: 23px; border: 1px solid rgba(255,255,255,0.6); display: flex; align-items: center; padding: 0 16px; box-sizing: border-box">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Reply to afosi</span>
      <input placeholder="Jibu afosi…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-size: 15px; font-family: Inter, system-ui, sans-serif">
    </label>
    <button aria-label="Like story" style="width: 46px; height: 46px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7.5-4.6-9.5-9.2C1.1 8.4 3.3 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.7 0 5.9 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"></path></svg>
    </button>
    <button aria-label="Share story" style="width: 46px; height: 46px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"></path></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      reactions: [
        { emoji: '😂', label: 'React laughing' },
        { emoji: '😮', label: 'React surprised' },
        { emoji: '😍', label: 'React love' },
        { emoji: '😢', label: 'React sad' },
        { emoji: '👏', label: 'React clap' },
        { emoji: '🔥', label: 'React fire' },
      ],
    };
  }
}
</script>
</body>
</html>
