<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stories posting ring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007AFF}a:hover{color:#0062cc}
@keyframes ring{0%{stroke-dashoffset:276}100%{stroke-dashoffset:60}}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{animation:ring 2.6s ease-in-out infinite alternate}
.spin{animation:spin 1.4s linear infinite;transform-origin:50% 50%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; overflow: hidden">
  <div style="padding: 58px 16px 8px; display: flex; align-items: center">
    <img src="/_blob/4c69b82c7339d387af7e5d36a2047c26" alt="KChat" style="width: 32px; height: 32px">
    <div style="flex-grow: 1"></div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
  </div>
  <!-- story tray -->
  <div style="display: flex; gap: 14px; padding: 8px 16px 14px; overflow: hidden">
    <!-- yours: posting ring -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px">
      <div style="position: relative; width: 72px; height: 72px">
        <svg width="72" height="72" viewBox="0 0 96 96" aria-hidden="true" style="position: absolute; left: 0; top: 0">
          <circle cx="48" cy="48" r="44" fill="none" stroke="#E5E5EA" stroke-width="4"></circle>
          <circle class="ring" cx="48" cy="48" r="44" fill="none" stroke="#3FA845" stroke-width="4" stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="90" transform="rotate(-90 48 48)"></circle>
        </svg>
        <div style="position: absolute; left: 8px; top: 8px; width: 56px; height: 56px; border-radius: 28px; background: linear-gradient(135deg,#3FA845,#86BD2E); opacity: .55"></div>
      </div>
      <span style="font-size: 12px; color: #6B6B70">Posting…</span>
    </div>
    <!-- failed with retry -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px">
      <div style="position: relative; width: 72px; height: 72px">
        <div style="position: absolute; inset: 0; border-radius: 36px; border: 3px solid #FF3B30"></div>
        <div style="position: absolute; left: 8px; top: 8px; width: 56px; height: 56px; border-radius: 28px; background: #FF6A3D; opacity: .5"></div>
        <div style="position: absolute; left: 24px; top: 24px; width: 24px; height: 24px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg></div>
      </div>
      <span style="font-size: 12px; color: #FF3B30; font-weight: 600">Tap to retry</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px">
      <div style="width: 72px; height: 72px; border-radius: 36px; border: 3px solid #3FA845; padding: 3px; box-sizing: border-box"><div style="width: 100%; height: 100%; border-radius: 30px; background: #F2A81D"></div></div>
      <span style="font-size: 12px; color: #000">[name]</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px">
      <div style="width: 72px; height: 72px; border-radius: 36px; border: 3px solid #3FA845; padding: 3px; box-sizing: border-box"><div style="width: 100%; height: 100%; border-radius: 30px; background: #5B4BC4"></div></div>
      <span style="font-size: 12px; color: #000">[name]</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px">
      <div style="width: 72px; height: 72px; border-radius: 36px; border: 3px solid #E5E5EA; padding: 3px; box-sizing: border-box"><div style="width: 100%; height: 100%; border-radius: 30px; background: #1F7A8C"></div></div>
      <span style="font-size: 12px; color: #8A8A8E">[name]</span>
    </div>
  </div>

  <!-- the viewer: thumbnail first, shimmer on the active bar, cube turn hint -->
  <div style="margin: 6px 16px 0; height: 560px; border-radius: 24px; background: #1A1A1E; position: relative; overflow: hidden; transform: perspective(900px) rotateY(-14deg); transform-origin: right center">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 30%, #5B4BC4 0%, #1A1A1E 60%); filter: blur(18px); opacity: .7"></div>
    <div style="position: absolute; left: 10px; right: 10px; top: 12px; display: flex; gap: 4px">
      <span style="flex: 1; height: 3px; border-radius: 2px; background: #fff"></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: #fff; border-radius: 2px"></span></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35)"></span>
    </div>
    <div style="position: absolute; left: 12px; top: 26px; display: flex; align-items: center; gap: 8px">
      <div style="width: 32px; height: 32px; border-radius: 16px; background: #F2A81D"></div>
      <span style="font-size: 14px; font-weight: 700; color: #fff">[name]</span><span style="font-size: 13px; color: rgba(255,255,255,.7)">2h</span>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.65))"></div>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,.5); display: flex; align-items: center; padding: 0 14px; color: rgba(255,255,255,.75); font-size: 15px">Send message</div>
      <span style="font-size: 24px">&#10084;&#65039;</span><span style="font-size: 24px">&#128293;</span>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 12.5px; color: rgba(255,255,255,.75); text-align: center; line-height: 17px">blurred thumbnail shows first<br>bar never stutters<br>next person turns in like a cube</div>
  </div>
</div>
